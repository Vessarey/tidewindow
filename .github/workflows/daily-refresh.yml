# Daily data refresh: re-runs the NOAA pipeline, commits fresh window data,
# and pushes — which triggers the Pages deploy. This keeps every page's
# numbers current even on days the editorial agent does nothing.
name: Daily data refresh

on:
  schedule:
    # GitHub's scheduler has drifted every slot 2-9h late daily since
    # 2026-08-26, so we run FOUR staggered slots: with the observed drift, at
    # least one lands the refresh well before the editorial agent's ~12:00Z
    # session. The skip-if-refreshed guard below makes every slot after the
    # first successful one a ~10s no-op, so extra fires cost nothing and
    # never double-commit. 04:47 is the early bird; 10:17 remains the
    # "canonical" refresh time referenced in docs.
    - cron: "47 4 * * *" # 04:47 UTC early slot
    - cron: "17 7 * * *" # 07:17 UTC backup
    - cron: "17 10 * * *" # 10:17 UTC daily (~3:17 AM Pacific)
    - cron: "47 13 * * *" # 13:47 UTC daily watchdog
  workflow_dispatch:

permissions:
  contents: write

# One refresh at a time — a manual dispatch overlapping the scheduled run
# would race on the data commit push.
concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 30
      # Scheduled runs (either slot) skip when today's refresh already
      # committed — so the 13:47 watchdog is a no-op on normal days and the
      # 10:17 slot is a no-op if it fires late after a recovery. Manual
      # dispatches always run in full.
      - name: Check whether today's refresh already landed
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && \
             git log --format=%s -30 | grep -q "^data: daily NOAA refresh $(date -u +%F)$"; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "Refresh for $(date -u +%F) already on main; skipping."
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.done != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - if: steps.guard.outputs.done != 'true'
        run: npm ci
      # NOAA CO-OPS has service-wide outages now and then (e.g. 2026-07-18, when
      # every predictions request errored for hours). Retry across ~100 minutes
      # so a morning blip self-heals; a day-long outage still fails the run loudly.
      - name: Refresh NOAA data
        if: steps.guard.outputs.done != 'true'
        run: |
          for attempt in 1 2 3 4 5 6; do
            if PIPELINE_REFRESH=1 node scripts/pipeline/run.mjs; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              echo "NOAA refresh failed (attempt $attempt/6); retrying in 20 minutes..."
              sleep 1200
            fi
          done
          echo "NOAA refresh failed after 6 attempts (~100 minutes)."
          exit 1
      - name: Regenerate fact sheets
        if: steps.guard.outputs.done != 'true'
        run: node scripts/pipeline/facts.mjs
      - name: Build (verifies data integrity)
        if: steps.guard.outputs.done != 'true'
        run: npm run build
      - name: Submit to IndexNow
        if: steps.guard.outputs.done != 'true'
        run: node scripts/indexnow.mjs
        continue-on-error: true
      - name: Commit and push
        if: steps.guard.outputs.done != 'true'
        run: |
          git config user.name "tidewindow-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A public/data-json public/ics public/embed-badge docs-internal/facts
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: daily NOAA refresh $(date -u +%F)"
            # The editorial agent may push to main while this job runs (it did
            # on 2026-07-30, rejecting our push and losing the day's refresh).
            # Data commits only touch pipeline output paths, so rebasing over
            # editorial commits is conflict-free — retry a few times.
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "Push rejected (attempt $attempt/3); rebasing onto latest main..."
              git pull --rebase origin main
            done
            git push
          fi
