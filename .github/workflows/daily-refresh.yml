# Daily data refresh: re-runs the NOAA pipeline, commits fresh window data,
# and pushes — which triggers the Pages deploy. This keeps every page's
# numbers current even on days the editorial agent does nothing.
name: Daily data refresh

on:
  schedule:
    - cron: "17 10 * * *" # 10:17 UTC daily (~3:17 AM Pacific)
  workflow_dispatch:

permissions:
  contents: write

# One refresh at a time — a manual dispatch overlapping the scheduled run
# would race on the data commit push.
concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # NOAA CO-OPS has service-wide outages now and then (e.g. 2026-07-18, when
      # every predictions request errored for hours). Retry across ~100 minutes
      # so a morning blip self-heals; a day-long outage still fails the run loudly.
      - name: Refresh NOAA data
        run: |
          for attempt in 1 2 3 4 5 6; do
            if PIPELINE_REFRESH=1 node scripts/pipeline/run.mjs; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              echo "NOAA refresh failed (attempt $attempt/6); retrying in 20 minutes..."
              sleep 1200
            fi
          done
          echo "NOAA refresh failed after 6 attempts (~100 minutes)."
          exit 1
      - name: Regenerate fact sheets
        run: node scripts/pipeline/facts.mjs
      - name: Build (verifies data integrity)
        run: npm run build
      - name: Submit to IndexNow
        run: node scripts/indexnow.mjs
        continue-on-error: true
      - name: Commit and push
        run: |
          git config user.name "tidewindow-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A public/data-json public/ics public/embed-badge docs-internal/facts
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: daily NOAA refresh $(date -u +%F)"
            # The editorial agent may push to main while this job runs (it did
            # on 2026-07-30, rejecting our push and losing the day's refresh).
            # Data commits only touch pipeline output paths, so rebasing over
            # editorial commits is conflict-free — retry a few times.
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "Push rejected (attempt $attempt/3); rebasing onto latest main..."
              git pull --rebase origin main
            done
            git push
          fi
